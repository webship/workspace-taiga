# Taiga of this project, as Taiga's own reference setup (taiga-docker) runs it: its back end, the back end's Celery
# worker (async), its front end, its events (the live board), its protected media, the nginx gateway in front of them,
# and the two RabbitMQ (one for Celery, one for the events). The database is the project's own db service, on
# PostgreSQL, which Taiga needs. Every image is pinned (.env), never "latest"; RabbitMQ and nginx are the exact releases
# the reference's tags (3.8-management-alpine, 1.19-alpine) stand for. The project's web container keeps the mail
# catcher, where Taiga's mail goes. Written by the Taiga builder of the workspace (the plugin's
# docker-compose.taiga.yaml); build again rather than editing by hand. The site's own values (its secret key, the
# RabbitMQ password) are in taiga/env, which only you can read.
x-taiga-back: &taiga-back
  image: "${TAIGA_BACK_IMAGE:-docker.io/taigaio/taiga-back:6.10.2}"
  labels:
    com.ddev.site-name: ${DDEV_SITENAME}
    com.ddev.approot: ${DDEV_APPROOT}
  restart: "no"
  env_file:
    - ${DDEV_APPROOT}/taiga/env
  volumes:
    - static:/taiga-back/static
    - media:/taiga-back/media
    # The plugin's script, which the builder and the tool run with Taiga's own code.
    - ${DDEV_APPROOT}/taiga:/opt/webship:ro
  depends_on:
    db:
      condition: service_healthy
    taiga-events-rabbitmq:
      condition: service_started
    taiga-async-rabbitmq:
      condition: service_started
x-rabbitmq: &rabbitmq
  image: "${TAIGA_RABBITMQ_IMAGE:-docker.io/library/rabbitmq:3.8.34-management-alpine}"
  labels:
    com.ddev.site-name: ${DDEV_SITENAME}
    com.ddev.approot: ${DDEV_APPROOT}
  restart: "no"
  env_file:
    - ${DDEV_APPROOT}/taiga/rabbitmq.env
services:
  web:
    environment:
      - HTTP_EXPOSE=8093:80,8025:8025
      - HTTPS_EXPOSE=8457:80,8026:8025
  taiga-back:
    <<: *taiga-back
    container_name: ddev-${DDEV_SITENAME}-taiga-back
    expose:
      - "8000"
  taiga-async:
    <<: *taiga-back
    container_name: ddev-${DDEV_SITENAME}-taiga-async
    entrypoint: ["/taiga-back/docker/async_entrypoint.sh"]
    # After the back end: both mount the same new static volume, which Docker fills from the image when a container is
    # made with it, and two made at once can fail ("mkdir …/_data/img: file exists", seen 2026-11-26). Taiga's reference
    # setup starts them together.
    depends_on:
      db:
        condition: service_healthy
      taiga-events-rabbitmq:
        condition: service_started
      taiga-async-rabbitmq:
        condition: service_started
      taiga-back:
        condition: service_started
  taiga-async-rabbitmq:
    <<: *rabbitmq
    container_name: ddev-${DDEV_SITENAME}-taiga-async-rabbitmq
    hostname: taiga-async-rabbitmq
    volumes:
      - async-rabbitmq:/var/lib/rabbitmq
  taiga-front:
    image: "${TAIGA_FRONT_IMAGE:-docker.io/taigaio/taiga-front:6.10.3}"
    container_name: ddev-${DDEV_SITENAME}-taiga-front
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    restart: "no"
    env_file:
      - ${DDEV_APPROOT}/taiga/front.env
  taiga-events:
    image: "${TAIGA_EVENTS_IMAGE:-docker.io/taigaio/taiga-events:6.10.0}"
    container_name: ddev-${DDEV_SITENAME}-taiga-events
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    # taiga-events 6.10.0 exits on an unhandled rejection ("Channel ended, no reply will be forthcoming") when a page
    # closes its websocket right after subscribing, as a quick change of page does (seen 2026-11-26), and Taiga's
    # reference setup leaves it down. Here it comes back on its own.
    restart: on-failure
    env_file:
      - ${DDEV_APPROOT}/taiga/events.env
    depends_on:
      taiga-events-rabbitmq:
        condition: service_started
  taiga-events-rabbitmq:
    <<: *rabbitmq
    container_name: ddev-${DDEV_SITENAME}-taiga-events-rabbitmq
    hostname: taiga-events-rabbitmq
    volumes:
      - events-rabbitmq:/var/lib/rabbitmq
  taiga-protected:
    image: "${TAIGA_PROTECTED_IMAGE:-docker.io/taigaio/taiga-protected:6.10.1}"
    container_name: ddev-${DDEV_SITENAME}-taiga-protected
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    restart: "no"
    env_file:
      - ${DDEV_APPROOT}/taiga/protected.env
  taiga-gateway:
    image: "${TAIGA_GATEWAY_IMAGE:-docker.io/library/nginx:1.19.10-alpine}"
    container_name: ddev-${DDEV_SITENAME}-taiga-gateway
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    restart: "no"
    expose:
      - "80"
    volumes:
      - ${DDEV_APPROOT}/taiga/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/taiga/static
      - media:/taiga/media
    depends_on:
      - taiga-front
      - taiga-back
      - taiga-events
    environment:
      VIRTUAL_HOST: ${DDEV_HOSTNAME}
      HTTP_EXPOSE: "80:80"
      HTTPS_EXPOSE: "443:80"
# Named after the project, so removing the project removes them with it, and a new build starts empty. The database's
# data is the db service's own volume.
volumes:
  static:
    name: ddev-${DDEV_SITENAME}-taiga-static
  media:
    name: ddev-${DDEV_SITENAME}-taiga-media
  async-rabbitmq:
    name: ddev-${DDEV_SITENAME}-taiga-async-rabbitmq
  events-rabbitmq:
    name: ddev-${DDEV_SITENAME}-taiga-events-rabbitmq
