# Taiga's gateway on Docker Compose, Podman and Kubernetes: nginx in the web container, run as the host user
# (taiga/taiga-serve.sh), with the routes of Taiga's reference gateway (taiga-gateway.conf on DDEV): the front end, the
# API and the admin of the back end (in this container), its static files, its media through the protected service (and
# the exports unprotected), and the events' websocket. Written by the Taiga builder of the workspace; build again rather
# than editing.
worker_processes 1;
pid /tmp/taiga-nginx/nginx.pid;
error_log stderr warn;
events {
    worker_connections 1024;
}
http {
    access_log off;
    client_body_temp_path /tmp/taiga-nginx/body;
    proxy_temp_path /tmp/taiga-nginx/proxy;
    fastcgi_temp_path /tmp/taiga-nginx/fastcgi;
    uwsgi_temp_path /tmp/taiga-nginx/uwsgi;
    scgi_temp_path /tmp/taiga-nginx/scgi;
    # The types of the files it serves itself (Taiga's static files, the media).
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server {
        listen 8080 default_server;
        client_max_body_size 100M;
        charset utf-8;
        # The addresses of the front end, the events and the protected media, and the DNS server that looks them up
        # while nginx runs (written by taiga-serve.sh at the start, from the container's own).
        include /tmp/taiga-nginx/services.conf;

        location / {
            proxy_pass $taiga_front;
            proxy_pass_header Server;
            proxy_set_header Host $http_host;
            proxy_redirect off;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Scheme $scheme;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8000/api/;
            proxy_pass_header Server;
            proxy_set_header Host $http_host;
            proxy_redirect off;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Scheme $scheme;
        }

        location /admin/ {
            proxy_pass http://127.0.0.1:8000/admin/;
            proxy_pass_header Server;
            proxy_set_header Host $http_host;
            proxy_redirect off;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Scheme $scheme;
        }

        location /static/ {
            alias /taiga-back/static/;
        }

        location /_protected/ {
            internal;
            alias /var/www/html/taiga/files/media/;
            add_header Content-disposition "attachment";
        }

        location /media/exports/ {
            alias /var/www/html/taiga/files/media/exports/;
            add_header Content-disposition "attachment";
        }

        # The protected service checks a media link's token and answers with where the file is (/_protected/...).
        location /media/ {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Scheme $scheme;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            rewrite ^/media/(.*)$ /$1 break;
            proxy_pass $taiga_protected;
            proxy_redirect off;
        }

        location /events {
            proxy_pass $taiga_events;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
        }
    }
}
